# BL33 size diet (t72). UrsusBoot must fit the Nokia stock bootloader window
# (scripts/ci/check_bl33_budget.py). Disabled: features nothing in UrsusBoot,
# its default environment, WebFailsafe, UrsusFlasher or UrsidoRescue uses.
# Measured on t72 (LZMA BL33): MF -52 KiB, MD -33 KiB.
#
# Kept on purpose: hash (MF UART recovery runs `hash sha256`), crc32, cmp,
# loadb/loadx/loady (UART), tftpboot, wget + dns, ubi (+rename), mtd,
# itest/setexpr/iminfo/bootm + gzip (env scripts, OpenWrt FIT), mii/dm/pinmux/
# bdinfo/env import-export (hardware debugging).

# UBIFS (only UBI is used; was left on MF, MD already forbids it): -30 KiB
# CONFIG_CMD_UBIFS is not set
# Partition tables: SPI-NAND has none
# CONFIG_CMD_GPT is not set
# CONFIG_CMD_PART is not set
# CONFIG_EFI_PARTITION is not set
# Network extras: static 192.168.1.1, no DHCP/NTP
# CONFIG_CMD_DHCP is not set
# CONFIG_CMD_SNTP is not set
# Image formats never booted here (OpenWrt boots FIT via bootm)
# CONFIG_CMD_ELF is not set
# CONFIG_CMD_BOOTI is not set
# CONFIG_CMD_XIMG is not set
# CONFIG_CMD_UNLZ4 is not set
# CONFIG_CMD_LOADS is not set
# Interactive/rare commands
# CONFIG_CMD_ASKENV is not set
# CONFIG_CMD_EDITENV is not set
# CONFIG_CMD_SOURCE is not set
# CONFIG_CMD_RANDOM is not set
# CONFIG_CMD_UUID is not set
# CONFIG_CMD_SMC is not set
# CONFIG_CMD_STRINGS is not set
# Long per-command help text (short usage stays)
# CONFIG_SYS_LONGHELP is not set
# CONFIG_FIT_VERBOSE is not set
# CONFIG_SHA512 is not set
# Standard boot / VBE / block layer: UrsusBoot boots through ursusdispatch (MD had these on)
# CONFIG_BOOTSTD is not set
# CONFIG_BOOTMETH_VBE is not set
# CONFIG_CMD_BOOTFLOW is not set
# CONFIG_UBI_BLOCK is not set
# CONFIG_CMD_BLOCK_CACHE is not set
# CONFIG_BLOCK_CACHE is not set
# CONFIG_CMD_MTD_NAND_READ_TEST is not set
# CONFIG_CMD_MTD_NAND_WRITE_TEST is not set
