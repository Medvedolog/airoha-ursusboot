name: One-shot README import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-readme-import.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Medvedolog/airoha-router-ursusflasher/claude/eloquent-heisenberg-78tcii/patches/ursusboot-standalone/ursusboot-README.md' -o README.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text()
          s=s.replace('> These TFTP paths run from the dispatcher or the console **instead of** WebFailsafe, not alongside it. WebFailsafe itself never issues a network command.','> `ping` and `tftpboot` are shared-netif aware: while WebFailsafe owns Ethernet they borrow its live lwIP netif instead of tearing it down. Other network commands fail closed while the WebFailsafe netif is active. UART `Ctrl-C` stops WebFailsafe and `ursusweb` starts it again.')
          s=s.replace('| `scripts/make-install-mtd0.py` | Merge a 512 KiB stock boot-area template with a FIP into a flashable `mtd0` image. Validates size, FIP magic and that the FIP does not overlap the preserved env area. Prints the SHA256. |','| `scripts/repack-fip.py` | Preserve the proven reference FIP and replace only BL33 with the U-Boot produced by the current build. |\n| `scripts/lzma1ext_noeopm.c` | Host LZMA1EXT/no-EOPM packer for Airoha BL33. |\n| `scripts/make-install-mtd0.py` | Merge the board 512 KiB boot-area template with the newly repacked FIP. |')
          s=s.replace('The only external build dependency permitted by policy is an **OpenWrt SDK/toolchain** appropriate for the target Airoha SoC.','The only external target build dependency permitted by policy is an **OpenWrt SDK/toolchain** appropriate for the target Airoha SoC. The host also needs a C compiler and liblzma development headers for BL33 packing.')
          s=s.replace('This emits `dist/xg040-md/ursusboot-install-mtd0.bin`.','This emits `u-boot.bin`, `u-boot.lzma`, a newly repacked `ursusboot-update.fip`, and `ursusboot-install-mtd0.bin` under `dist/xg040-md/`. The install image contains the U-Boot produced by the same build, not the BL33 payload from the reference FIP.')
          p.write_text(s)
          PY
          ./scripts/qa.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: import standalone architecture and build contract'
          git push origin HEAD:main
