name: One-shot complete source import

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/fix-source-import.yml']

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace partial source with complete pinned TEST61 tree
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN_SHA=e7f96d507c3c54deab62c845aa8081fff052dc8c
          curl -fL --retry 3 "https://codeload.github.com/Medvedolog/airoha-router-ursusflasher/tar.gz/${ORIGIN_SHA}" -o /tmp/origin.tar.gz
          mkdir -p /tmp/origin /tmp/raw
          tar -xzf /tmp/origin.tar.gz -C /tmp/origin
          OLD="$(find /tmp/origin -mindepth 1 -maxdepth 1 -type d | head -1)"
          tar --zstd -xf "$OLD/ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst" -C /tmp/raw

          rm -rf src/u-boot
          mkdir -p src/u-boot
          COUNT="$(find /tmp/raw -mindepth 1 -maxdepth 1 | wc -l)"
          ONLY="$(find /tmp/raw -mindepth 1 -maxdepth 1 -type d | head -1 || true)"
          if [ "$COUNT" -eq 1 ] && [ -n "$ONLY" ]; then
            cp -a "$ONLY"/. src/u-boot/
          else
            cp -a /tmp/raw/. src/u-boot/
          fi

          for p in Makefile Kconfig arch board common drivers include net; do
            test -e "src/u-boot/$p" || { echo "missing source path: $p" >&2; exit 1; }
          done

          find . -path './.git' -prune -o -path './.github/workflows/fix-source-import.yml' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'source: import complete pinned TEST61 tree'
          git push origin HEAD:main
