name: Run shared-netif patch
on:
  push:
    branches: [main]
    paths:
      - scripts/apply-shared-netif.py
      - .github/workflows/run-shared-netif-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python3 scripts/apply-shared-netif.py || true
          grep -q 'Network busy: active lwIP interface' src/u-boot/net/lwip/net-lwip.c
          grep -q 'bool borrowed = false' src/u-boot/cmd/lwip/ping.c
          grep -q 'bool borrowed = false' src/u-boot/net/lwip/tftp.c
          grep -q 'URSUS_CONSOLE_DEFER' src/u-boot/cmd/ursusweb.c
          grep -q 'URSUS_WEB_STOP_REQUEST source=UART' src/u-boot/cmd/ursusweb.c
          git diff --check
      - run: ./scripts/qa.sh
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/u-boot/net/lwip/net-lwip.c src/u-boot/cmd/lwip/ping.c src/u-boot/net/lwip/tftp.c src/u-boot/cmd/ursusweb.c
          git commit -m 'net: share UrsusWeb lwIP netif with ping and TFTP'
          git push origin HEAD:main
