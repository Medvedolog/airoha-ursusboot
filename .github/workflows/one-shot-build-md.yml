name: One-shot xg040-md build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-build-md.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblzma-dev
      - name: Download pinned OpenWrt Airoha SDK snapshot
        shell: bash
        run: |
          set -euo pipefail
          URL='https://downloads.openwrt.org/snapshots/targets/airoha/an7581/openwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst'
          curl -fL "$URL" -o /tmp/sdk.tar.zst
          echo '5f34d4c9119ff3f2e8ff3f00262707ae07c9bb87752efc392aad498caef02abf  /tmp/sdk.tar.zst' | sha256sum -c -
          mkdir -p /tmp/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp/sdk
          SDKROOT="$(find /tmp/sdk -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)"
          test -n "$SDKROOT"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
      - name: Standalone QA
        run: ./scripts/qa.sh
      - name: Build xg040-md persistent
        shell: bash
        run: |
          set -euo pipefail
          OPENWRT_SDK="$SDKROOT" ./build.sh xg040-md persistent
          ls -l dist/xg040-md
          sha256sum dist/xg040-md/*
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/xg040-md')
          for n in ['u-boot.bin','u-boot.lzma','ursusboot-update.fip','ursusboot-install-mtd0.bin']:
              f=p/n
              print(f'BUILD_ARTIFACT {n} size={f.stat().st_size}')
          assert (p/'ursusboot-install-mtd0.bin').stat().st_size == 0x80000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ursusboot-xg040-md-build
          path: dist/xg040-md/
