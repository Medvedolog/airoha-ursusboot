name: One-shot xg040-md build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-build-md.yml']
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential liblzma-dev bison flex swig python3-dev libssl-dev bc device-tree-compiler pkg-config zstd
      - name: Download official OpenWrt AArch64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          URL='https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-toolchain-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst'
          curl --http1.1 -fL -C - --retry 8 --retry-all-errors --retry-delay 2 "$URL" -o /tmp/toolchain.tar.zst
          sha256sum /tmp/toolchain.tar.zst
          mkdir -p /tmp/toolchain
          tar --zstd -xf /tmp/toolchain.tar.zst -C /tmp/toolchain
          SDKROOT="$(find /tmp/toolchain -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$SDKROOT"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
      - name: Standalone QA
        run: ./scripts/qa.sh
      - name: Build xg040-md persistent
        shell: bash
        run: |
          set -euo pipefail
          OPENWRT_SDK="$SDKROOT" ./build.sh xg040-md persistent
          ls -lh dist/xg040-md
          stat -c '%n %s bytes' dist/xg040-md/u-boot.bin dist/xg040-md/u-boot.lzma dist/xg040-md/ursusboot-update.fip dist/xg040-md/ursusboot-install-mtd0.bin
          cat dist/xg040-md/SHA256SUMS
          test "$(stat -c %s dist/xg040-md/ursusboot-install-mtd0.bin)" -eq 524288
      - uses: actions/upload-artifact@v4
        with:
          name: ursusboot-xg040-md-build
          path: dist/xg040-md/
