name: One-shot standalone import

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/bootstrap-import.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import clean pinned TEST61 standalone tree
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN_SHA=e7f96d507c3c54deab62c845aa8081fff052dc8c
          curl -fL --retry 3 "https://codeload.github.com/Medvedolog/airoha-router-ursusflasher/tar.gz/${ORIGIN_SHA}" -o /tmp/origin.tar.gz
          mkdir -p /tmp/origin /tmp/test61-src
          tar -xzf /tmp/origin.tar.gz -C /tmp/origin
          OLD="$(find /tmp/origin -mindepth 1 -maxdepth 1 -type d | head -1)"

          mkdir -p boards/nokia-xg040-md boards/nokia-xg040-mf config scripts docs reference/md src/u-boot dist
          cp "$OLD/payloads/md/stock/nokia-xg-040g-md-stock-mtd0.bin" boards/nokia-xg040-md/stock-mtd0-template.bin
          cp "$OLD/payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin" boards/nokia-xg040-mf/stock-mtd0-template.bin
          cp "$OLD/payloads/md/ursusboot/ursusboot-md-0.1.0-alpha5-UBIUX1-TEST61-update.fip" reference/md/ursusboot-test61-update.fip
          cp "$OLD/ursusboot/board-policies/xg040-md.h" boards/xg040-md.h
          cp "$OLD/ursusboot/board-policies/xg040-mf.h" boards/xg040-mf.h
          cp "$OLD/ursusboot/board-policies/xg140-md.h" boards/xg140-md.h
          for f in board-profiles.json ursusboot-common.cfg ursusboot-soc-an7581.cfg ursusboot-soc-an7583.cfg ursusboot-board-md.cfg ursusboot-board-mf.cfg ursusboot-board-xg140.cfg ursusboot-storage-env-nowhere.cfg ursusboot-storage-ubi-redundant.cfg u-boot.TEST61.full.config an7583_nokia_xg-040g-mf_MF2_RAM_defconfig; do cp "$OLD/ursusboot/configs/$f" config/; done
          for f in apply_board_policy.py apply_kconfig_fragment.py apply_runtime_role.py resolve_board_profile.py; do cp "$OLD/ursusboot/scripts/$f" scripts/; done

          tar --zstd -xf "$OLD/ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst" -C /tmp/test61-src
          TOP="$(find /tmp/test61-src -mindepth 1 -maxdepth 1 -type d | head -1 || true)"
          if [ -n "$TOP" ]; then cp -a "$TOP"/. src/u-boot/; else cp -a /tmp/test61-src/. src/u-boot/; fi

          printf '%s\n' '0.1.0-alpha5-UBIUX1-TEST61' > VERSION
          cat > .gitignore <<'EOF'
          /dist/*
          !/dist/.gitkeep
          **/__pycache__/
          *.pyc
          .config.old
          EOF
          : > dist/.gitkeep

          cat > scripts/make-install-mtd0.py <<'PY'
          #!/usr/bin/env python3
          import argparse, hashlib
          from pathlib import Path
          p=argparse.ArgumentParser(); p.add_argument('--template',required=True); p.add_argument('--fip',required=True); p.add_argument('--output',required=True); p.add_argument('--fip-offset',type=lambda x:int(x,0),default=0x800); p.add_argument('--env-offset',type=lambda x:int(x,0),default=0x7c000)
          a=p.parse_args(); t=bytearray(Path(a.template).read_bytes()); f=Path(a.fip).read_bytes()
          if len(t)!=0x80000: raise SystemExit('template must be exactly 512 KiB')
          if a.fip_offset+len(f)>a.env_offset: raise SystemExit('FIP overlaps preserved stock env area')
          if f[:4]!=b'\x01\x00\x64\xaa': raise SystemExit('FIP magic mismatch')
          t[a.fip_offset:a.fip_offset+len(f)]=f; Path(a.output).parent.mkdir(parents=True,exist_ok=True); Path(a.output).write_bytes(t)
          print('output:',a.output); print('sha256:',hashlib.sha256(t).hexdigest())
          PY
          chmod +x scripts/make-install-mtd0.py

          cat > build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")" && pwd)"; BOARD="${1:-xg040-md}"; ROLE="${2:-persistent}"; SDK="${OPENWRT_SDK:-${3:-}}"
          case "$BOARD" in
            xg040-md) TEMPLATE="$ROOT/boards/nokia-xg040-md/stock-mtd0-template.bin"; CONFIG="$ROOT/config/u-boot.TEST61.full.config" ;;
            xg040-mf) TEMPLATE="$ROOT/boards/nokia-xg040-mf/stock-mtd0-template.bin"; CONFIG="$ROOT/config/an7583_nokia_xg-040g-mf_MF2_RAM_defconfig" ;;
            *) echo "usage: OPENWRT_SDK=/path/to/sdk ./build.sh {xg040-md|xg040-mf} [persistent|ram-recovery]" >&2; exit 2 ;;
          esac
          : "${SDK:?Set OPENWRT_SDK to an extracted OpenWrt SDK/toolchain}"
          export STAGING_DIR="$SDK/staging_dir"
          CROSS="$(find "$STAGING_DIR" -type f \( -name 'aarch64-openwrt-linux-musl-gcc' -o -name 'aarch64-openwrt-linux-gcc' \) | head -1 || true)"; [ -n "$CROSS" ] || { echo 'AArch64 compiler not found in OpenWrt SDK' >&2; exit 3; }; export CROSS_COMPILE="${CROSS%gcc}"
          cp "$CONFIG" "$ROOT/src/u-boot/.config"; make -C "$ROOT/src/u-boot" olddefconfig; make -C "$ROOT/src/u-boot" -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          mkdir -p "$ROOT/dist/$BOARD"; cp "$ROOT/src/u-boot/u-boot.bin" "$ROOT/dist/$BOARD/u-boot.bin"
          FIP="${URSUS_FIP:-}"; if [ -z "$FIP" ] && [ "$BOARD" = xg040-md ]; then FIP="$ROOT/reference/md/ursusboot-test61-update.fip"; fi
          if [ -n "$FIP" ] && [ -f "$FIP" ]; then python3 "$ROOT/scripts/make-install-mtd0.py" --template "$TEMPLATE" --fip "$FIP" --output "$ROOT/dist/$BOARD/ursusboot-install-mtd0.bin"; fi
          SH
          chmod +x build.sh

          cat > scripts/qa.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")/.." && pwd)"; python3 -m py_compile "$ROOT"/scripts/*.py
          ROOT="$ROOT" python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          r=Path(os.environ['ROOT']); json.loads((r/'config/board-profiles.json').read_text())
          for rel,want in {'boards/nokia-xg040-md/stock-mtd0-template.bin':'0256f49128aa00e2b5c2d613c1ae9b06d2278010','boards/nokia-xg040-mf/stock-mtd0-template.bin':'54250bac7bb00b0938b7702df2ea522c4464a0cd'}.items():
              b=(r/rel).read_bytes(); assert len(b)==0x80000; got=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest(); assert got==want,(rel,got)
          f=(r/'reference/md/ursusboot-test61-update.fip').read_bytes(); assert len(f)==503808 and f[:4]==b'\x01\x00\x64\xaa'
          print('board templates + TEST61 FIP: PASS')
          PY
          test -d "$ROOT/src/u-boot"; grep -q 'Repository policy: self-contained' "$ROOT/README.md"; echo URSUSBOOT_STANDALONE_QA=PASS
          SH
          chmod +x scripts/qa.sh

          cat > docs/PORTING.md <<'EOF'
          # Porting UrsusBoot
          Keep SoC support, board policy and storage policy separate. Add a board policy/header, Kconfig fragments, NAND/boot geometry and a documented recovery path. CI PASS is not HW PASS; new boards remain unproven until tested on hardware.
          EOF
          cat > docs/INSTALLING.md <<'EOF'
          # Installing
          Supported Nokia board templates are committed here, so a donor `mtd0` is not required. Device identity (RI/BOSA/MAC/serial/GPON) is separate from these generic boot templates. UrsusFlasher is the recommended Windows/Linux installer, backup and BootROM/UART recovery orchestrator.
          EOF
          cat > docs/PROVENANCE.md <<EOF
          # Provenance
          Standalone import baseline: \`Medvedolog/airoha-router-ursusflasher@${ORIGIN_SHA}\`.
          Hardware-proven MD baseline: \`UrsusBoot 0.1.0-alpha5-UBIUX1-TEST61\`. TEST57-TEST60 iteration scripts and transition-debug archaeology are intentionally omitted; the exact TEST61 source snapshot is committed under \`src/u-boot/\`.
          EOF
          cat > docs/CREDITS.md <<'EOF'
          # Credits
          UrsusBoot builds on U-Boot, Trusted Firmware-A and OpenWrt. Particular thanks to Daniel Golle (dangowrt), hanwckf and Yuzhii0718 for the OpenWrt-aware bootloader, UBI installation, WebFailsafe and recovery ecosystem that preceded this project.
          EOF
          cat > src/README.md <<'EOF'
          # Source tree
          `src/u-boot/` is the unpacked pinned TEST61 source baseline. Normal builds do not fetch source, patches or binary donors from another repository; the only external build prerequisite is the appropriate OpenWrt SDK/toolchain.
          EOF
          if [ -f src/u-boot/Licenses/gpl-2.0.txt ]; then cp src/u-boot/Licenses/gpl-2.0.txt LICENSE; elif [ -f "$OLD/LICENSE" ]; then cp "$OLD/LICENSE" LICENSE; else printf '%s\n' 'SPDX-License-Identifier: GPL-2.0-or-later' 'See licensing notices in src/u-boot/.' > LICENSE; fi

          # The Actions token cannot modify workflow files. Keep this bootstrap unchanged in this commit;
          # it is removed separately through the GitHub API after a successful import.
          git checkout -- .github/workflows/bootstrap-import.yml
          rm -f .github/workflows/qa.yml
          find . -path './.git' -prune -o -path './.github/workflows/bootstrap-import.yml' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'import standalone UrsusBoot TEST61 baseline'; git push origin HEAD:main
