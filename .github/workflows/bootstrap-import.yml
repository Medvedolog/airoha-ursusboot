name: One-shot standalone import

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned TEST61 baseline and clean standalone tree
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN_SHA=e7f96d507c3c54deab62c845aa8081fff052dc8c
          curl -fL --retry 3 "https://codeload.github.com/Medvedolog/airoha-router-ursusflasher/tar.gz/${ORIGIN_SHA}" -o /tmp/origin.tar.gz
          mkdir -p /tmp/origin
          tar -xzf /tmp/origin.tar.gz -C /tmp/origin
          OLD="$(find /tmp/origin -mindepth 1 -maxdepth 1 -type d | head -1)"

          mkdir -p boards/nokia-xg040-md boards/nokia-xg040-mf config scripts tools docs reference/md src/u-boot dist .github/workflows

          # Exact board templates and hardware-proven TEST61 payload.
          cp "$OLD/payloads/md/stock/nokia-xg-040g-md-stock-mtd0.bin" boards/nokia-xg040-md/stock-mtd0-template.bin
          cp "$OLD/payloads/mf/stock/nokia-xg-040g-mf-stock-mtd0.bin" boards/nokia-xg040-mf/stock-mtd0-template.bin
          cp "$OLD/payloads/md/ursusboot/ursusboot-md-0.1.0-alpha5-UBIUX1-TEST61-update.fip" reference/md/ursusboot-test61-update.fip

          # Public porting surface only: no TEST57-60 build scripts or transition-debug archaeology.
          cp "$OLD/ursusboot/board-policies/xg040-md.h" boards/xg040-md.h
          cp "$OLD/ursusboot/board-policies/xg040-mf.h" boards/xg040-mf.h
          cp "$OLD/ursusboot/board-policies/xg140-md.h" boards/xg140-md.h
          cp "$OLD/ursusboot/configs/board-profiles.json" config/
          cp "$OLD/ursusboot/configs/ursusboot-common.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-soc-an7581.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-soc-an7583.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-board-md.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-board-mf.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-board-xg140.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-storage-env-nowhere.cfg" config/
          cp "$OLD/ursusboot/configs/ursusboot-storage-ubi-redundant.cfg" config/
          cp "$OLD/ursusboot/configs/u-boot.TEST61.full.config" config/
          cp "$OLD/ursusboot/configs/an7583_nokia_xg-040g-mf_MF2_RAM_defconfig" config/
          cp "$OLD/ursusboot/scripts/apply_board_policy.py" scripts/
          cp "$OLD/ursusboot/scripts/apply_kconfig_fragment.py" scripts/
          cp "$OLD/ursusboot/scripts/apply_runtime_role.py" scripts/
          cp "$OLD/ursusboot/scripts/resolve_board_profile.py" scripts/

          # Make the repository truly self-contained: unpack the exact pinned TEST61 source snapshot.
          mkdir -p /tmp/test61-src
          tar --zstd -xf "$OLD/ursusboot/source/ursusboot-0.1.0-alpha5-UBIUX1-TEST61-source.tar.zst" -C /tmp/test61-src
          TOP="$(find /tmp/test61-src -mindepth 1 -maxdepth 1 -type d | head -1 || true)"
          if [ -n "$TOP" ]; then
            cp -a "$TOP"/. src/u-boot/
          else
            cp -a /tmp/test61-src/. src/u-boot/
          fi

          cat > VERSION <<'EOF'
          0.1.0-alpha5-UBIUX1-TEST61
          EOF

          cat > .gitignore <<'EOF'
          /dist/*
          !/dist/.gitkeep
          **/__pycache__/
          *.pyc
          .config.old
          EOF
          : > dist/.gitkeep

          cat > scripts/make-install-mtd0.py <<'PY'
          #!/usr/bin/env python3
          import argparse, hashlib
          from pathlib import Path
          p=argparse.ArgumentParser(description='Build a 512 KiB Nokia boot block from a board stock template and an UrsusBoot FIP')
          p.add_argument('--template', required=True); p.add_argument('--fip', required=True); p.add_argument('--output', required=True)
          p.add_argument('--fip-offset', type=lambda x:int(x,0), default=0x800); p.add_argument('--env-offset', type=lambda x:int(x,0), default=0x7c000)
          a=p.parse_args(); t=bytearray(Path(a.template).read_bytes()); f=Path(a.fip).read_bytes()
          if len(t)!=0x80000: raise SystemExit(f'template must be 0x80000 bytes, got {len(t):#x}')
          if a.fip_offset+len(f)>a.env_offset: raise SystemExit('FIP overlaps preserved stock env area')
          if f[:4]!=b'\x01\x00\x64\xaa': raise SystemExit('FIP magic mismatch')
          t[a.fip_offset:a.fip_offset+len(f)]=f
          Path(a.output).parent.mkdir(parents=True,exist_ok=True); Path(a.output).write_bytes(t)
          print('output:',a.output); print('sha256:',hashlib.sha256(t).hexdigest())
          PY

          cat > build.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          BOARD="${1:-xg040-md}"; ROLE="${2:-persistent}"; SDK="${OPENWRT_SDK:-${3:-}}"
          case "$BOARD" in
            xg040-md)
              TEMPLATE="$ROOT/boards/nokia-xg040-md/stock-mtd0-template.bin"
              CONFIG="$ROOT/config/u-boot.TEST61.full.config"
              ;;
            xg040-mf)
              TEMPLATE="$ROOT/boards/nokia-xg040-mf/stock-mtd0-template.bin"
              CONFIG="$ROOT/config/an7583_nokia_xg-040g-mf_MF2_RAM_defconfig"
              ;;
            *) echo "usage: OPENWRT_SDK=/path/to/sdk ./build.sh {xg040-md|xg040-mf} [persistent|ram-recovery]" >&2; exit 2 ;;
          esac
          : "${SDK:?Set OPENWRT_SDK to an extracted OpenWrt SDK/toolchain}"
          STAGING_DIR="$SDK/staging_dir"; export STAGING_DIR
          CROSS="$(find "$STAGING_DIR" -type f \( -name 'aarch64-openwrt-linux-musl-gcc' -o -name 'aarch64-openwrt-linux-gcc' \) | head -1 || true)"
          [ -n "$CROSS" ] || { echo 'AArch64 compiler not found in OpenWrt SDK' >&2; exit 3; }
          export CROSS_COMPILE="${CROSS%gcc}"
          cp "$CONFIG" "$ROOT/src/u-boot/.config"
          make -C "$ROOT/src/u-boot" olddefconfig
          make -C "$ROOT/src/u-boot" -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
          mkdir -p "$ROOT/dist/$BOARD"
          cp "$ROOT/src/u-boot/u-boot.bin" "$ROOT/dist/$BOARD/u-boot.bin"
          FIP="${URSUS_FIP:-}"
          if [ -z "$FIP" ] && [ "$BOARD" = xg040-md ]; then FIP="$ROOT/reference/md/ursusboot-test61-update.fip"; fi
          if [ -n "$FIP" ] && [ -f "$FIP" ]; then
            python3 "$ROOT/scripts/make-install-mtd0.py" --template "$TEMPLATE" --fip "$FIP" --output "$ROOT/dist/$BOARD/ursusboot-install-mtd0.bin"
          fi
          SH
          chmod +x build.sh scripts/make-install-mtd0.py

          cat > scripts/qa.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          python3 -m py_compile "$ROOT"/scripts/*.py
          ROOT="$ROOT" python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ['ROOT'])
          json.loads((root/'config/board-profiles.json').read_text())
          checks={
            'boards/nokia-xg040-md/stock-mtd0-template.bin':'0256f49128aa00e2b5c2d613c1ae9b06d2278010',
            'boards/nokia-xg040-mf/stock-mtd0-template.bin':'54250bac7bb00b0938b7702df2ea522c4464a0cd',
          }
          for rel,want in checks.items():
            b=(root/rel).read_bytes()
            if len(b)!=0x80000: raise SystemExit(f'{rel}: bad size')
            got=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
            if got!=want: raise SystemExit(f'{rel}: git blob mismatch {got}')
          f=(root/'reference/md/ursusboot-test61-update.fip').read_bytes()
          if len(f)!=503808 or f[:4]!=b'\x01\x00\x64\xaa': raise SystemExit('TEST61 FIP contract mismatch')
          print('board templates + TEST61 FIP: PASS')
          PY
          test -d "$ROOT/src/u-boot"
          grep -q 'Repository policy: self-contained' "$ROOT/README.md"
          echo URSUSBOOT_STANDALONE_QA=PASS
          SH
          chmod +x scripts/qa.sh

          cat > .github/workflows/qa.yml <<'YML'
          name: QA
          on: [push, pull_request]
          jobs:
            standalone-qa:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: bash ./scripts/qa.sh
          YML

          cat > docs/PORTING.md <<'EOF'
          # Porting UrsusBoot
          Keep SoC support, board policy and storage policy separate. A new Airoha port should add a board policy/header, Kconfig fragments, NAND/boot geometry and a documented hardware acceptance path. Do not fork the common WebFailsafe/UBI core merely to add a board.

          CI PASS is not HW PASS. New boards remain unproven until exercised on hardware with a recovery path.
          EOF

          cat > docs/INSTALLING.md <<'EOF'
          # Installing
          Supported Nokia board templates are committed to this repository; a donor `mtd0` is not a prerequisite. The XG-040G-MD reference path can build a complete 512 KiB install boot block from the committed TEST61 FIP. Device identity (RI/BOSA/MAC/serial/GPON) is outside the generic board template and must be preserved or restored separately.

          UrsusFlasher is the recommended Windows/Linux operator orchestrator for backup, stock-Linux installation, OpenWrt installation, WebFailsafe and Airoha BootROM/UART brick recovery.
          EOF

          cat > docs/PROVENANCE.md <<EOF
          # Provenance
          Standalone import baseline: \`Medvedolog/airoha-router-ursusflasher@${ORIGIN_SHA}\`.

          Hardware-proven MD baseline: \`UrsusBoot 0.1.0-alpha5-UBIUX1-TEST61\`.
          The public standalone repository deliberately omits TEST57-TEST60 iteration scripts, transition-debug branches and UrsusFlasher host code. The exact TEST61 source snapshot is unpacked under \`src/u-boot/\` so normal builds do not fetch another repository.
          EOF

          cat > docs/CREDITS.md <<'EOF'
          # Credits
          UrsusBoot builds on the work of the U-Boot, Trusted Firmware-A and OpenWrt communities. Particular thanks to Daniel Golle (dangowrt) for OpenWrt U-Boot/UBI installation architecture, hanwckf for bl-mt798x and failsafe Web UI/multi-layout work, and Yuzhii0718 for continuing and extending the recovery/bootloader ecosystem.
          EOF

          cat > src/README.md <<'EOF'
          # Source tree
          `src/u-boot/` is the unpacked, pinned TEST61 source baseline. It is committed intentionally: after the one-shot repository import, UrsusBoot must not depend on another repository for source, patches or binary donors. The only external build prerequisite is the appropriate OpenWrt SDK/toolchain.
          EOF

          # GPL-2.0 text from the U-Boot project tree we just imported.
          cp src/u-boot/Licenses/gpl-2.0.txt LICENSE 2>/dev/null || cp src/u-boot/COPYING LICENSE

          find . -path './.git' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

          # Remove this bootstrap itself: final repository has no fetch-from-old-repo mechanism.
          rm -f .github/workflows/bootstrap-import.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'import standalone UrsusBoot TEST61 baseline'
          git push origin HEAD:main
