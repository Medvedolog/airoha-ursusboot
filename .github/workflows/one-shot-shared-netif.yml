name: One-shot shared lwIP netif patch

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/one-shot-shared-netif.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared-netif WebFailsafe patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'pattern not unique in {path}: {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          # 1) Never destroy somebody else's live lwIP netif. Commands which
          #    are not explicitly borrow-aware fail closed instead.
          replace_once(
              'src/u-boot/net/lwip/net-lwip.c',
              '\tif (eth_start_udev(udev) < 0) {\n\t\tlog_err("Could not start %s\\n", udev->name);\n\t\treturn NULL;\n\t}\n\n\tnetif_remove(net_lwip_get_netif());\n',
              '\tif (eth_start_udev(udev) < 0) {\n\t\tlog_err("Could not start %s\\n", udev->name);\n\t\treturn NULL;\n\t}\n\n\t/* A long-lived owner such as UrsusWeb may already have the single lwIP\n\t * netif installed. Never tear it down implicitly: borrow-aware clients\n\t * (ping/TFTP) reuse it, while other commands fail closed. */\n\tif (net_lwip_get_netif()) {\n\t\tprintf("Network busy: active lwIP interface is owned by another service.\\n"\n\t\t       "Stop WebFailsafe with Ctrl-C, run the command, then restart with 'ursusweb'.\\n");\n\t\treturn NULL;\n\t}\n'
          )

          # 2) ping: if UrsusWeb already owns the same device/netif, borrow it.
          replace_once(
              'src/u-boot/cmd/lwip/ping.c',
              '\tstruct ping_ctx ctx = {};\n\tstruct netif *netif;\n\tint ret;\n\n\tnetif = net_lwip_new_netif(udev);\n\tif (!netif)\n\t\treturn -ENODEV;\n',
              '\tstruct ping_ctx ctx = {};\n\tstruct netif *netif;\n\tbool borrowed = false;\n\tint ret;\n\n\tnetif = net_lwip_get_netif();\n\tif (netif) {\n\t\tif (netif->state != udev)\n\t\t\treturn -EBUSY;\n\t\tborrowed = true;\n\t} else {\n\t\tnetif = net_lwip_new_netif(udev);\n\t\tif (!netif)\n\t\t\treturn -ENODEV;\n\t}\n'
          )
          replace_once(
              'src/u-boot/cmd/lwip/ping.c',
              '\tnet_lwip_remove_netif(netif);\n\n\tif (ctx.alive)\n',
              '\tif (!borrowed)\n\t\tnet_lwip_remove_netif(netif);\n\n\tif (ctx.alive)\n'
          )

          # 3) TFTP: same borrow rule. net_lwip_eth_start/stop is already
          #    refcounted, so nested use does not halt Ethernet owned by web.
          replace_once(
              'src/u-boot/net/lwip/tftp.c',
              '\tint blksize = CONFIG_TFTP_BLOCKSIZE;\n\tstruct netif *netif;\n\tstruct tftp_ctx ctx;\n',
              '\tint blksize = CONFIG_TFTP_BLOCKSIZE;\n\tstruct netif *netif;\n\tbool borrowed = false;\n\tstruct tftp_ctx ctx;\n'
          )
          replace_once(
              'src/u-boot/net/lwip/tftp.c',
              '\tnetif = net_lwip_new_netif(udev);\n\tif (!netif)\n\t\treturn -1;\n\n\tctx.done = NOT_DONE;\n',
              '\tnetif = net_lwip_get_netif();\n\tif (netif) {\n\t\tif (netif->state != udev)\n\t\t\treturn -EBUSY;\n\t\tborrowed = true;\n\t} else {\n\t\tnetif = net_lwip_new_netif(udev);\n\t\tif (!netif)\n\t\t\treturn -1;\n\t}\n\n\tctx.done = NOT_DONE;\n'
          )
          # Two exits remove the netif: immediate tftp_get() failure and normal cleanup.
          replace_once(
              'src/u-boot/net/lwip/tftp.c',
              '\tif (err != ERR_OK) {\n\t\tprintf("tftp_get() error %d\\n", err);\n\t\tnet_lwip_remove_netif(netif);\n\t\treturn -1;\n\t}\n',
              '\tif (err != ERR_OK) {\n\t\tprintf("tftp_get() error %d\\n", err);\n\t\tif (!borrowed)\n\t\t\tnet_lwip_remove_netif(netif);\n\t\treturn -1;\n\t}\n'
          )
          replace_once(
              'src/u-boot/net/lwip/tftp.c',
              '\ttftp_cleanup();\n\n\tnet_lwip_remove_netif(netif);\n\n\tif (ctx.done == SUCCESS) {\n',
              '\ttftp_cleanup();\n\n\tif (!borrowed)\n\t\tnet_lwip_remove_netif(netif);\n\n\tif (ctx.done == SUCCESS) {\n'
          )

          # 4) Web console: never execute U-Boot commands recursively from a
          #    TCP receive callback. Defer every command to the main UrsusWeb
          #    loop. This makes shared ping/TFTP safe from the browser too.
          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              'struct ursus_conn {\n',
              'struct ursus_conn {\n'
          )
          # Insert pending-console state immediately after struct ursus_conn.
          p = Path('src/u-boot/cmd/ursusweb.c')
          s = p.read_text()
          marker = '    bool reboot_after_response;\n};\n\nstatic void ursus_log_reset(void)\n'
          insert = '''    bool reboot_after_response;\n};\n\n/* Web-console commands are deferred out of the lwIP TCP receive callback.\n * This avoids recursively entering net_lwip_rx() when ping/TFTP is used. */\nstatic struct tcp_pcb *ursus_console_pending_pcb;\nstatic struct ursus_conn *ursus_console_pending_conn;\nstatic char ursus_console_pending_cmd[256];\n\nstatic void ursus_console_pending_clear(struct ursus_conn *c)\n{\n    if (!c || ursus_console_pending_conn == c) {\n        ursus_console_pending_pcb = NULL;\n        ursus_console_pending_conn = NULL;\n        ursus_console_pending_cmd[0] = 0;\n    }\n}\n\nstatic void ursus_log_reset(void)\n'''
          if marker not in s or s.count(marker) != 1:
              raise SystemExit('ursus_conn insertion marker missing/non-unique')
          p.write_text(s.replace(marker, insert, 1))

          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              '    free(c);\n    if (stop)\n        ursus_stop = true;\n',
              '    ursus_console_pending_clear(c);\n    free(c);\n    if (stop)\n        ursus_stop = true;\n'
          )
          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              'static void ursus_http_err(void *arg, err_t err)\n{\n    struct ursus_conn *c = arg;\n    printf("URSUS_HTTP_ERROR conn=%u err=%d\\n", c ? c->id : 0, err);\n    free(c);\n}\n',
              'static void ursus_http_err(void *arg, err_t err)\n{\n    struct ursus_conn *c = arg;\n    printf("URSUS_HTTP_ERROR conn=%u err=%d\\n", c ? c->id : 0, err);\n    ursus_console_pending_clear(c);\n    free(c);\n}\n'
          )

          # Replace synchronous /api/console execution with queueing.
          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              '        ursus_console_capture(cmd);\n        return ursus_http_start_response(pcb, c, 200, "text/plain; charset=utf-8", ursus_console_body);\n',
              '        if (ursus_console_pending_conn)\n            return ursus_http_start_response(pcb, c, 409, "text/plain; charset=utf-8",\n                "another Web console command is still running\\n");\n        ursus_console_pending_pcb = pcb;\n        ursus_console_pending_conn = c;\n        snprintf(ursus_console_pending_cmd, sizeof(ursus_console_pending_cmd), "%s", cmd);\n        printf("URSUS_CONSOLE_DEFER cmd=%s\\n", cmd);\n        return ERR_OK;\n'
          )

          # Service deferred command after console_capture(), where both capture
          # and HTTP response helpers are available.
          p = Path('src/u-boot/cmd/ursusweb.c')
          s = p.read_text()
          marker = 'static int ursus_console_capture_selftest(void)\n'
          helper = '''static void ursus_console_service_pending(void)\n{\n    struct tcp_pcb *pcb = ursus_console_pending_pcb;\n    struct ursus_conn *c = ursus_console_pending_conn;\n    char cmd[sizeof(ursus_console_pending_cmd)];\n    err_t err;\n\n    if (!pcb || !c || !ursus_console_pending_cmd[0])\n        return;\n\n    snprintf(cmd, sizeof(cmd), "%s", ursus_console_pending_cmd);\n    ursus_console_capture(cmd);\n\n    /* The command may pump lwIP (ping/TFTP). The browser is allowed to\n     * disconnect while it runs, so only answer if the connection survived. */\n    if (ursus_console_pending_pcb != pcb || ursus_console_pending_conn != c)\n        return;\n\n    ursus_console_pending_pcb = NULL;\n    ursus_console_pending_conn = NULL;\n    ursus_console_pending_cmd[0] = 0;\n    err = ursus_http_start_response(pcb, c, 200, "text/plain; charset=utf-8",\n                                    ursus_console_body);\n    if (err != ERR_OK)\n        ursus_conn_release(pcb, c, true);\n}\n\nstatic int ursus_console_capture_selftest(void)\n'''
          if marker not in s or s.count(marker) != 1:
              raise SystemExit('console service insertion marker missing/non-unique')
          p.write_text(s.replace(marker, helper, 1))

          # UART Ctrl-C really stops UrsusWeb and returns to normal U-Boot shell.
          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              '        if (ch == 3) {\n            printf("^C\\n");\n            ursus_uart_line_len = 0;\n            ursus_uart_shell_prompt();\n            continue;\n        }\n',
              '        if (ch == 3) {\n            printf("^C\\nURSUS_WEB_STOP_REQUEST source=UART\\n");\n            ursus_uart_line_len = 0;\n            ursus_stop = true;\n            return;\n        }\n'
          )

          # Run deferred console command only after net_lwip_rx() unwinds.
          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              '        ursus_uart_shell_poll();\n        ret = net_lwip_rx(ursus_web_udev, netif);\n        ursus_rx_report(ret);\n        sys_check_timeouts();\n',
              '        ursus_uart_shell_poll();\n        if (ursus_stop)\n            break;\n        ret = net_lwip_rx(ursus_web_udev, netif);\n        ursus_rx_report(ret);\n        ursus_console_service_pending();\n        sys_check_timeouts();\n'
          )

          # Clear any pending browser command on shutdown and document restart.
          replace_once(
              'src/u-boot/cmd/ursusweb.c',
              '    ursus_web_udev = NULL;\n    ursus_web_running = false;\n\n    if (ursus_network_failed)\n',
              '    ursus_web_udev = NULL;\n    ursus_web_running = false;\n    ursus_console_pending_clear(NULL);\n    printf("URSUS_WEB_STOPPED restart=ursusweb\\n");\n\n    if (ursus_network_failed)\n'
          )

          # QA: source-level invariants for the new ownership contract.
          q = Path('scripts/qa.sh')
          qs = q.read_text()
          tail = "test -d \"$ROOT/src/u-boot\"; grep -q 'Repository policy: self-contained' \"$ROOT/README.md\"; echo URSUSBOOT_STANDALONE_QA=PASS\n"
          repl = """test -d \"$ROOT/src/u-boot\"\ngrep -q 'Repository policy: self-contained' \"$ROOT/README.md\"\ngrep -q 'bool borrowed = false' \"$ROOT/src/u-boot/cmd/lwip/ping.c\"\ngrep -q 'bool borrowed = false' \"$ROOT/src/u-boot/net/lwip/tftp.c\"\ngrep -q 'URSUS_CONSOLE_DEFER' \"$ROOT/src/u-boot/cmd/ursusweb.c\"\ngrep -q 'URSUS_WEB_STOP_REQUEST source=UART' \"$ROOT/src/u-boot/cmd/ursusweb.c\"\ngrep -q 'Network busy: active lwIP interface' \"$ROOT/src/u-boot/net/lwip/net-lwip.c\"\necho URSUSBOOT_STANDALONE_QA=PASS\n"""
          if tail not in qs:
              raise SystemExit('qa tail marker missing')
          q.write_text(qs.replace(tail, repl, 1))
          PY

          git diff --check
          ./scripts/qa.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/u-boot/net/lwip/net-lwip.c src/u-boot/cmd/lwip/ping.c src/u-boot/net/lwip/tftp.c src/u-boot/cmd/ursusweb.c scripts/qa.sh
          git commit -m 'net: share UrsusWeb lwIP netif with ping and TFTP'
          git push origin HEAD:main
